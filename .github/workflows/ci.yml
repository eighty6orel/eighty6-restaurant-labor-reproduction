name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src scripts tests --exclude scripts/_make_fixtures.py
      - name: Secrets grep
        run: |
          set -euo pipefail
          if git grep -nE 'e86_[A-Za-z0-9]{8,}|postgres://|sk_live_|sk_test_|DATABASE_URL=' -- ':!.env.example' ':!GAPS.md' ':!README.md' ':!SECURITY.md' ':!.github/**'; then
            echo "Possible secret pattern found in tracked files"
            exit 1
          fi
          echo "No secret patterns found"
      - name: Pytest (offline fixtures)
        run: pytest
        env:
          E86_API_KEY: ""
